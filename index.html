<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.D. La Motilla B - Gestión de Equipo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .modal-overlay { background-color: rgba(0, 0, 0, 0.75); }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

  <!-- PANTALLA DE ACCESO/LOGIN -->
  <div id="pantallaAcceso" class="fixed inset-0 bg-blue-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full text-center">
      <div class="w-20 h-20 bg-blue-100 text-blue-800 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold shadow-inner">
        <i class="fas fa-user-lock"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-1">C.D. La Motilla B</h2>
      <p class="text-gray-500 text-sm mb-6">Acceso exclusivo para el Cuerpo Técnico</p>
      
      <form onsubmit="event.preventDefault(); comprobarAcceso();">
        <input type="password" id="claveAcceso" placeholder="Introduce tu PIN personal" 
               class="w-full text-center text-2xl tracking-widest px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 mb-4"
               autocomplete="off" autofocus>
        <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200">
          Entrar a la App
        </button>
      </form>
      <p id="errorAcceso" class="text-red-500 text-xs font-semibold mt-3 hidden">
        <i class="fas fa-exclamation-circle"></i> Clave incorrecta. Inténtalo de nuevo.
      </p>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL DE LA APP -->
  <div id="appContenido" class="hidden">
    <!-- CABECERA -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <div>
          <h1 id="tituloCabecera" class="text-xl md:text-2xl font-bold tracking-wide">C.D. La Motilla B</h1>
          <p id="subtituloUsuario" class="text-xs text-blue-200 font-medium"></p>
        </div>
        <button onclick="cerrarSesion()" class="bg-blue-800 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 border border-blue-600 shadow">
          <i class="fas fa-sign-out-alt"></i> Salir
        </button>
      </div>
      
      <!-- NAVEGACIÓN PRINCIPAL -->
      <nav class="bg-blue-950 px-4">
        <div class="max-w-4xl mx-auto flex justify-between overflow-x-auto">
          <button onclick="cambiarPestana('partido')" id="tab-partido" class="pestana-btn text-blue-200 py-3 px-3 border-b-2 border-transparent font-medium text-sm whitespace-nowrap flex items-center gap-2">
            <i class="fas fa-[#]"></i> Partido en Directo
          </button>
          <button onclick="cambiarPestana('plantilla')" id="tab-plantilla" class="pestana-btn text-blue-200 py-3 px-3 border-b-2 border-transparent font-medium text-sm whitespace-nowrap flex items-center gap-2">
            <i class="fas fa-users"></i> Plantilla
          </button>
          <button onclick="cambiarPestana('fichas')" id="tab-fichas" class="pestana-btn text-blue-200 py-3 px-3 border-b-2 border-transparent font-medium text-sm whitespace-nowrap flex items-center gap-2">
            <i class="fas fa-id-card"></i> Fichas Individuales
          </button>
          <button onclick="cambiarPestana('historial')" id="tab-historial" class="pestana-btn text-blue-200 py-3 px-3 border-b-2 border-transparent font-medium text-sm whitespace-nowrap flex items-center gap-2">
            <i class="fas fa-history"></i> Historial
          </button>
        </div>
      </nav>
    </header>

    <main class="max-w-4xl mx-auto p-4">

      <!-- SECCIÓN 1: PARTIDO EN DIRECTO -->
      <section id="sec-partido" class="seccion-contenido">
        <div class="bg-white rounded-xl shadow-md p-4 mb-4 border border-gray-200">
          <div class="flex justify-between items-center mb-3">
            <div>
              <span class="text-xs uppercase font-bold text-gray-400 tracking-wider">Jornada / Rival</span>
              <input type="text" id="partidoRival" placeholder="Rival (ej: CD Montequinto)" class="block font-bold text-lg text-gray-800 border-b border-gray-300 focus:border-blue-600 outline-none w-full mt-0.5">
            </div>
            <div class="text-right">
              <span id="cronometro" class="text-3xl font-mono font-bold text-blue-900 block">00:00</span>
              <span id="partePartidoText" class="text-xs font-semibold text-gray-500 uppercase">1ª Parte</span>
            </div>
          </div>

          <div class="flex gap-2 border-t pt-3">
            <button id="btnTimerStart" onclick="alternarTimer()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-2 shadow">
              <i class="fas fa-play"></i> <span id="labelTimerStart">Iniciar Partido</span>
            </button>
            <button onclick="siguienteParte()" class="bg-gray-700 hover:bg-gray-800 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1 shadow">
              <i class="fas fa-step-forward"></i> Cambiar Parte
            </button>
            <button onclick="finalizarPartido()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-1 shadow">
              <i class="fas fa-flag-checkered"></i> Guardar
            </button>
          </div>
        </div>

        <!-- CONVOCATORIA Y CAMBIOS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- JUGADORES EN CAMPO -->
          <div class="bg-white rounded-xl shadow-md p-4 border border-green-200">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-green-100">
              <h3 class="font-bold text-green-900 flex items-center gap-2">
                <i class="fas fa-running text-green-600"></i> En Campo (<span id="countCampo">0</span>)
              </h3>
            </div>
            <div id="listaCampo" class="space-y-2"></div>
          </div>

          <!-- BANQUILLO -->
          <div class="bg-white rounded-xl shadow-md p-4 border border-yellow-200">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-yellow-100">
              <h3 class="font-bold text-yellow-900 flex items-center gap-2">
                <i class="fas fa-chair text-yellow-600"></i> Banquillo (<span id="countBanquillo">0</span>)
              </h3>
            </div>
            <div id="listaBanquillo" class="space-y-2"></div>
          </div>
        </div>
      </section>

      <!-- SECCIÓN 2: PLANTILLA -->
      <section id="sec-plantilla" class="seccion-contenido hidden">
        <div class="bg-white rounded-xl shadow-md p-4 mb-4 border border-gray-200">
          <h3 class="font-bold text-gray-800 mb-3 text-lg flex items-center gap-2">
            <i class="fas fa-user-plus text-blue-600"></i> Añadir Jugador
          </h3>
          <form onsubmit="event.preventDefault(); agregarJugador();" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="text" id="nuevoNombre" placeholder="Nombre completo" class="border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-600" required>
            <input type="number" id="nuevoDorsal" placeholder="Dorsal" class="border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-600" required>
            <button type="submit" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded-lg text-sm shadow">
              <i class="fas fa-plus"></i> Guardar
            </button>
          </form>
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 border border-gray-200">
          <h3 class="font-bold text-gray-800 mb-3 text-lg">Jugadores Registrados</h3>
          <div id="tablaPlantilla" class="divide-y divide-gray-100"></div>
        </div>
      </section>

      <!-- SECCIÓN 3: FICHAS INDIVIDUALES -->
      <section id="sec-fichas" class="seccion-contenido hidden">
        <div class="bg-white rounded-xl shadow-md p-4 mb-4 border border-gray-200">
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Seleccionar Jugador</label>
          <select id="selectorJugadorFicha" onchange="cargarFichaJugador()" class="w-full p-2.5 border border-gray-300 rounded-lg text-gray-800 font-medium focus:border-blue-600 outline-none">
            <option value="">-- Elige un jugador --</option>
          </select>
        </div>

        <div id="detalleFicha" class="hidden space-y-4">
          <div class="bg-blue-900 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
            <div>
              <h2 id="fichaNombre" class="text-2xl font-bold">---</h2>
              <p id="fichaDorsal" class="text-blue-200 font-semibold text-sm">Dorsal: --</p>
            </div>
            <div class="text-center bg-blue-800 px-4 py-2 rounded-lg border border-blue-700">
              <span id="fichaMinutosTotales" class="text-2xl font-mono font-bold block">0'</span>
              <span class="text-xs text-blue-300 uppercase">Totales</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-3 rounded-lg text-center shadow border border-gray-200">
              <span id="fichaGoles" class="text-xl font-bold text-blue-900 block">0</span>
              <span class="text-xs text-gray-500 font-semibold">Goles</span>
            </div>
            <div class="bg-white p-3 rounded-lg text-center shadow border border-gray-200">
              <span id="fichaAmarillas" class="text-xl font-bold text-yellow-600 block">0</span>
              <span class="text-xs text-gray-500 font-semibold">Amarillas</span>
            </div>
            <div class="bg-white p-3 rounded-lg text-center shadow border border-gray-200">
              <span id="fichaRojas" class="text-xl font-bold text-red-600 block">0</span>
              <span class="text-xs text-gray-500 font-semibold">Rojas</span>
            </div>
          </div>
        </div>
      </section>

      <!-- SECCIÓN 4: HISTORIAL DE PARTIDOS -->
      <section id="sec-historial" class="seccion-contenido hidden">
        <div class="bg-white rounded-xl shadow-md p-4 border border-gray-200">
          <h3 class="font-bold text-gray-800 mb-3 text-lg">Partidos Registrados</h3>
          <div id="listaHistorial" class="space-y-3"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- JAVASCRIPT LÓGICA -->
  <script>
    // ========================================================
    // CONFIGURACIÓN DE USUARIOS Y CONTROL DE ACCESO MULTIUSUARIO
    // ========================================================
    const USUARIOS = {
      "1234": "Entrenador",
      "5678": "Segundo Entrenador",
      "1111": "Delegado Campo",
      "9999": "Delegado Equipo"
    };

    function comprobarAcceso() {
      const valor = document.getElementById('claveAcceso').value.trim();
      
      if (USUARIOS[valor]) {
        sessionStorage.setItem('futbol_acceso_ok', '1');
        sessionStorage.setItem('futbol_usuario_activo', USUARIOS[valor]);
        
        mostrarApp();
      } else {
        document.getElementById('errorAcceso').classList.remove('hidden');
        document.getElementById('claveAcceso').value = '';
        document.getElementById('claveAcceso').focus();
      }
    }

    function mostrarApp() {
      document.getElementById('pantallaAcceso').classList.add('hidden');
      document.getElementById('appContenido').classList.remove('hidden');
      
      const usuarioActivo = sessionStorage.getItem('futbol_usuario_activo');
      if (usuarioActivo) {
        document.getElementById('subtituloUsuario').innerText = `Usuario: ${usuarioActivo}`;
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem('futbol_acceso_ok');
      sessionStorage.removeItem('futbol_usuario_activo');
      location.reload();
    }

    // ========================================================
    // ESTADO GLOBAL DE LA APLICACIÓN
    // ========================================================
    let plantilla = JSON.parse(localStorage.getItem('futbol_plantilla')) || [
      { id: 1, nombre: 'Jugador Ejemplo 1', dorsal: 1 },
      { id: 2, nombre: 'Jugador Ejemplo 2', dorsal: 10 }
    ];

    let historialPartidos = JSON.parse(localStorage.getItem('futbol_historial')) || [];

    let partidoActual = JSON.parse(localStorage.getItem('futbol_partido_actual')) || {
      rival: '',
      segundos: 0,
      corriendo: false,
      parte: 1,
      campo: [],
      banquillo: []
    };

    let timerInterval = null;

    // ========================================================
    // INICIALIZACIÓN
    // ========================================================
    window.onload = function() {
      // Verificar si ya está logueado en esta sesión
      if (sessionStorage.getItem('futbol_acceso_ok') === '1') {
        mostrarApp();
      }

      guardarPlantilla();
      renderizarPlantilla();
      renderizarPartidoActual();
      renderizarHistorial();
      cargarSelectorJugadoresFicha();
      if(partidoActual.corriendo) iniciarTimerLoop();
      
      // Activar primera pestaña por defecto
      cambiarPestana('partido');
    };

    // NAVEGACIÓN ENTRE PESTAÑAS
    function cambiarPestana(nombrePestana) {
      document.querySelectorAll('.seccion-contenido').forEach(sec => sec.classList.add('hidden'));
      document.querySelectorAll('.pestana-btn').forEach(btn => {
        btn.classList.remove('border-white', 'text-white', 'font-bold');
        btn.classList.add('text-blue-200', 'border-transparent');
      });

      document.getElementById(`sec-${nombrePestana}`).classList.remove('hidden');
      const tabActivo = document.getElementById(`tab-${nombrePestana}`);
      tabActivo.classList.add('border-white', 'text-white', 'font-bold');
      tabActivo.classList.remove('text-blue-200', 'border-transparent');
    }

    // ========================================================
    // GESTIÓN DE PLANTILLA
    // ========================================================
    function guardarPlantilla() {
      localStorage.setItem('futbol_plantilla', JSON.stringify(plantilla));
    }

    function renderizarPlantilla() {
      const contenedor = document.getElementById('tablaPlantilla');
      contenedor.innerHTML = '';

      if(plantilla.length === 0) {
        contenedor.innerHTML = '<p class="text-gray-400 text-sm py-2">No hay jugadores registrados.</p>';
        return;
      }

      plantilla.forEach(j => {
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center py-2 border-b border-gray-100 last:border-0';
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-800 font-bold flex items-center justify-center text-sm">${j.dorsal}</span>
            <span class="font-medium text-gray-800">${j.nombre}</span>
          </div>
          <button onclick="eliminarJugador(${j.id})" class="text-red-500 hover:text-red-700 px-2 py-1 text-sm">
            <i class="fas fa-trash"></i>
          </button>
        `;
        contenedor.appendChild(row);
      });
    }

    function agregarJugador() {
      const nombreInput = document.getElementById('nuevoNombre');
      const dorsalInput = document.getElementById('nuevoDorsal');

      if (!nombreInput.value || !dorsalInput.value) return;

      const nuevo = {
        id: Date.now(),
        nombre: nombreInput.value.trim(),
        dorsal: parseInt(dorsalInput.value)
      };

      plantilla.push(nuevo);
      guardarPlantilla();
      renderizarPlantilla();
      cargarSelectorJugadoresFicha();

      nombreInput.value = '';
      dorsalInput.value = '';
    }

    function eliminarJugador(id) {
      if(confirm('¿Eliminar este jugador de la plantilla?')) {
        plantilla = plantilla.filter(j => j.id !== id);
        guardarPlantilla();
        renderizarPlantilla();
        cargarSelectorJugadoresFicha();
      }
    }

    // ========================================================
    // LÓGICA DE CRONÓMETRO Y PARTIDO
    // ========================================================
    function alternarTimer() {
      if(partidoActual.corriendo) {
        // Pausar
        clearInterval(timerInterval);
        partidoActual.corriendo = false;
        document.getElementById('btnTimerStart').classList.replace('bg-yellow-600', 'bg-green-600');
        document.getElementById('labelTimerStart').innerText = 'Reanudar';
      } else {
        // Iniciar
        partidoActual.corriendo = true;
        iniciarTimerLoop();
        document.getElementById('btnTimerStart').classList.replace('bg-green-600', 'bg-yellow-600');
        document.getElementById('labelTimerStart').innerText = 'Pausar';
      }
      guardarEstadoPartido();
    }

    function iniciarTimerLoop() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        partidoActual.segundos++;
        actualizarRelojUI();
        
        // Sumar minutos a jugadores en campo
        partidoActual.campo.forEach(j => j.segundosJugados = (j.segundosJugados || 0) + 1);
        
        if(partidoActual.segundos % 5 === 0) guardarEstadoPartido();
      }, 1000);
    }

    function actualizarRelojUI() {
      const mins = String(Math.floor(partidoActual.segundos / 60)).padStart(2, '0');
      const secs = String(partidoActual.segundos % 60).padStart(2, '0');
      document.getElementById('cronometro').innerText = `${mins}:${secs}`;
    }

    function siguienteParte() {
      partidoActual.parte++;
      document.getElementById('partePartidoText').innerText = `${partidoActual.parte}ª Parte`;
      guardarEstadoPartido();
    }

    function guardarEstadoPartido() {
      partidoActual.rival = document.getElementById('partidoRival').value;
      localStorage.setItem('futbol_partido_actual', JSON.stringify(partidoActual));
    }

    function renderizarPartidoActual() {
      document.getElementById('partidoRival').value = partidoActual.rival || '';
      actualizarRelojUI();
      
      const listaCampo = document.getElementById('listaCampo');
      const listaBanquillo = document.getElementById('listaBanquillo');
      
      listaCampo.innerHTML = '';
      listaBanquillo.innerHTML = '';

      // Si no hay nadie en partido, poblar banquillo con la plantilla
      if (partidoActual.campo.length === 0 && partidoActual.banquillo.length === 0) {
        partidoActual.banquillo = plantilla.map(j => ({ ...j, goles: 0, amarillas: 0, rojas: 0, segundosJugados: 0 }));
      }

      document.getElementById('countCampo').innerText = partidoActual.campo.length;
      document.getElementById('countBanquillo').innerText = partidoActual.banquillo.length;

      // Render Campo
      partidoActual.campo.forEach(j => {
        const item = document.createElement('div');
        item.className = 'bg-green-50 p-2.5 rounded-lg border border-green-200 flex justify-between items-center';
        item.innerHTML = `
          <div>
            <span class="font-bold text-gray-800">#${j.dorsal} ${j.nombre}</span>
            <span class="text-xs text-gray-500 block">${Math.floor((j.segundosJugados || 0) / 60)}' jugados</span>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="anotarEvento(${j.id}, 'goles')" class="px-2 py-1 bg-white border rounded text-xs">⚽ ${j.goles || 0}</button>
            <button onclick="anotarEvento(${j.id}, 'amarillas')" class="px-2 py-1 bg-yellow-100 border border-yellow-300 rounded text-xs">🟨 ${j.amarillas || 0}</button>
            <button onclick="moverABanquillo(${j.id})" class="ml-2 p-1.5 bg-yellow-500 text-white rounded text-xs"><i class="fas fa-arrow-down"></i></button>
          </div>
        `;
        listaCampo.appendChild(item);
      });

      // Render Banquillo
      partidoActual.banquillo.forEach(j => {
        const item = document.createElement('div');
        item.className = 'bg-yellow-50 p-2.5 rounded-lg border border-yellow-200 flex justify-between items-center';
        item.innerHTML = `
          <div>
            <span class="font-bold text-gray-800">#${j.dorsal} ${j.nombre}</span>
          </div>
          <button onclick="moverACampo(${j.id})" class="p-1.5 bg-green-600 text-white rounded text-xs"><i class="fas fa-arrow-up"></i> Entrar</button>
        `;
        listaBanquillo.appendChild(item);
      });
    }

    function moverACampo(id) {
      const idx = partidoActual.banquillo.findIndex(j => j.id === id);
      if (idx !== -1) {
        const [jugador] = partidoActual.banquillo.splice(idx, 1);
        partidoActual.campo.push(jugador);
        guardarEstadoPartido();
        renderizarPartidoActual();
      }
    }

    function moverABanquillo(id) {
      const idx = partidoActual.campo.findIndex(j => j.id === id);
      if (idx !== -1) {
        const [jugador] = partidoActual.campo.splice(idx, 1);
        partidoActual.banquillo.push(jugador);
        guardarEstadoPartido();
        renderizarPartidoActual();
      }
    }

    function anotarEvento(id, tipo) {
      const jugador = partidoActual.campo.find(j => j.id === id);
      if (jugador) {
        jugador[tipo] = (jugador[tipo] || 0) + 1;
        guardarEstadoPartido();
        renderizarPartidoActual();
      }
    }

    function finalizarPartido() {
      if (!confirm('¿Guardar y finalizar este partido en el historial?')) return;

      clearInterval(timerInterval);
      partidoActual.corriendo = false;

      const registro = {
        fecha: new Date().toLocaleDateString(),
        rival: partidoActual.rival || 'Rival no especificado',
        duracionMinutos: Math.floor(partidoActual.segundos / 60),
        jugadores: [...partidoActual.campo, ...partidoActual.banquillo]
      };

      historialPartidos.unshift(registro);
      localStorage.setItem('futbol_historial', JSON.stringify(historialPartidos));

      // Reset partido
      partidoActual = { rival: '', segundos: 0, corriendo: false, parte: 1, campo: [], banquillo: [] };
      guardarEstadoPartido();
      renderizarPartidoActual();
      renderizarHistorial();
      alert('¡Partido guardado con éxito!');
    }

    // ========================================================
    // FICHAS E HISTORIAL
    // ========================================================
    function cargarSelectorJugadoresFicha() {
      const select = document.getElementById('selectorJugadorFicha');
      select.innerHTML = '<option value="">-- Elige un jugador --</option>';
      plantilla.forEach(j => {
        select.innerHTML += `<option value="${j.id}">#${j.dorsal} - ${j.nombre}</option>`;
      });
    }

    function cargarFichaJugador() {
      const id = parseInt(document.getElementById('selectorJugadorFicha').value);
      const contenedor = document.getElementById('detalleFicha');
      
      if (!id) {
        contenedor.classList.add('hidden');
        return;
      }

      const jugador = plantilla.find(j => j.id === id);
      if (!jugador) return;

      let segsTotales = 0, goles = 0, amarillas = 0, rojas = 0;

      historialPartidos.forEach(partido => {
        const datos = partido.jugadores.find(j => j.id === id);
        if (datos) {
          segsTotales += datos.segundosJugados || 0;
          goles += datos.goles || 0;
          amarillas += datos.amarillas || 0;
          rojas += datos.rojas || 0;
        }
      });

      document.getElementById('fichaNombre').innerText = jugador.nombre;
      document.getElementById('fichaDorsal').innerText = `Dorsal: #${jugador.dorsal}`;
      document.getElementById('fichaMinutosTotales').innerText = `${Math.floor(segsTotales / 60)}'`;
      document.getElementById('fichaGoles').innerText = goles;
      document.getElementById('fichaAmarillas').innerText = amarillas;
      document.getElementById('fichaRojas').innerText = rojas;

      contenedor.classList.remove('hidden');
    }

    function renderizarHistorial() {
      const lista = document.getElementById('listaHistorial');
      lista.innerHTML = '';

      if (historialPartidos.length === 0) {
        lista.innerHTML = '<p class="text-gray-400 text-sm">No hay partidos finalizados en el historial.</p>';
        return;
      }

      historialPartidos.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = 'bg-white p-3 rounded-lg border border-gray-200 shadow-sm';
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-gray-800">VS ${p.rival}</span>
            <span class="text-xs text-gray-400">${p.fecha} (${p.duracionMinutos} min)</span>
          </div>
        `;
        lista.appendChild(item);
      });
    }
  </script>
</body>
</html>
